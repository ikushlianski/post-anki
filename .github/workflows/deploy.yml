name: deploy

run-name: Deploy post-anki to prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pulumi_refresh:
        description: Run pulumi refresh before up (syncs state from GCP)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  # Test is split into parallel jobs; the `test` job below only gates on all of them so the
  # downstream `needs: test` lines stay as they are.
  checks:
    name: Typecheck and bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # Runs the real apps/web browser build and fails if any Node built-in gets externalized
      # into it. It needs an actual build, not a static scan, and a browser bundle that crashes
      # at runtime must never reach a deploy.
      - name: Check for Node built-ins in the web bundle
        run: node scripts/check-web-node-builtins.mjs

  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            workspaces: -w @post-anki/web
          - name: api
            workspaces: -w @post-anki/api
          - name: other
            workspaces: -w @post-anki/core -w @post-anki/bot -w @post-anki/extension -w @post-anki/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test ${{ matrix.workspaces }}

  # The apps/api integration tests run against a real Postgres, never a mock —
  # they exist to prove locking and transaction behavior that only a real
  # connection can demonstrate. Credentials and port mirror e2e/docker-compose.yml
  # so the same command works locally and here. Each test creates its own
  # throwaway database off this one and migrates into it, so no seed step is needed.
  integration:
    name: Integration (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postanki
          POSTGRES_PASSWORD: postanki
          POSTGRES_DB: postanki_e2e
        ports:
          - 5578:5432
        options: >-
          --health-cmd "pg_isready -U postanki -d postanki_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests (real Postgres)
        env:
          DATABASE_URL: postgres://postanki:postanki@localhost:5578/postanki_e2e
          LLM_MODE: mock
        run: npm run test:integration -w @post-anki/api

  test:
    name: Test
    needs: [checks, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all test jobs passed"

  review-factory-gate:
    name: Review Factory Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx depcruise --config .dependency-cruiser.cjs --output-type err apps packages
      - run: node scripts/check-no-dynamic-imports.mjs

  infra:
    name: Infra
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    env:
      PULUMI_BACKEND_URL: gs://post-anki-pulumi-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_CI_SA_EMAIL }}
      - uses: pulumi/actions@v6
      - name: Set Pulumi secrets from GitHub
        working-directory: infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PROD_PULUMI_CONFIG_PASSPHRASE }}
          API_SHARED_SECRET: ${{ secrets.PROD_API_SHARED_SECRET }}
        run: printf '%s' "$API_SHARED_SECRET" | pulumi config set --secret apiSharedSecret --stack prod
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
          refresh: ${{ github.event_name != 'workflow_dispatch' || inputs.pulumi_refresh }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PROD_PULUMI_CONFIG_PASSPHRASE }}

  deploy:
    name: Deploy
    needs: [test, infra, review-factory-gate]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_CI_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run bot database migrations
        run: npm run db:migrate:bot
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.PROD_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ vars.PROD_REGISTRY }}/bot:${{ github.sha }}
          docker build -f apps/bot/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          API_URL=$(gcloud run services describe post-anki-api --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)')
          gcloud run deploy post-anki-bot \
            --image "$IMAGE" \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --region ${{ vars.PROD_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60s \
            --port 8080 \
            --set-env-vars "TELEGRAM_BOT_TOKEN=${{ secrets.PROD_TELEGRAM_BOT_TOKEN }}" \
            --set-env-vars "TELEGRAM_WEBHOOK_SECRET=${{ secrets.PROD_TELEGRAM_WEBHOOK_SECRET }}" \
            --set-env-vars "OWNER_TELEGRAM_CHAT_ID=${{ secrets.PROD_OWNER_TELEGRAM_CHAT_ID }}" \
            --set-env-vars "API_BASE_URL=$API_URL" \
            --set-env-vars "API_SHARED_SECRET=${{ secrets.PROD_API_SHARED_SECRET }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars "LOG_LEVEL=info" \
            --quiet

      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe post-anki-bot --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)')
          echo "Health check: $URL/_healthz"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/_healthz")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s"
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1

  deploy-api:
    name: Deploy API
    needs: [test, infra, review-factory-gate]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_CI_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run API database migrations
        run: npm run db:migrate -w @post-anki/api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.PROD_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          IMAGE=${{ vars.PROD_REGISTRY }}/api:${{ github.sha }}
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Electric sync engine wiring. Dormant until PROD_ELECTRIC_ENABLED is set to
      # 'true' (same dormancy pattern as deploy-web's PROD_WEB_ENABLED), because
      # apps/api's shape proxy must not be reachable in production until the
      # server-side shape/table allowlist has landed — see
      # .planning/local-first-electric-sync/todo.md.
      # The URL is read back off the Pulumi-created Cloud Run service the same way
      # this workflow already resolves API_URL for the bot and web deploys, so it
      # can never drift from the `electricServiceUrl` stack output.
      - name: Resolve Electric service URL
        if: ${{ vars.PROD_ELECTRIC_ENABLED == 'true' }}
        run: |
          ELECTRIC_URL=$(gcloud run services describe post-anki-electric --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)')
          if [ -z "$ELECTRIC_URL" ]; then
            echo "post-anki-electric has no ready URL — the service exists but is not serving."
            echo "Most likely the Pulumi prod stack has no electricDatabaseUrl secret set, so the container cannot start."
            exit 1
          fi
          echo "ELECTRIC_URL=$ELECTRIC_URL" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        # ELECTRIC_AUTH_MODE is deliberately never set here: apps/api's env schema
        # defaults it to "iam", which is what production needs (Cloud Run
        # service-to-service ID tokens). Only local dev overrides it to "none".
        env:
          INNGEST_EVENT_KEY: ${{ secrets.PROD_INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.PROD_INNGEST_SIGNING_KEY }}
        run: |
          ELECTRIC_ARGS=()
          if [ -n "${ELECTRIC_URL:-}" ]; then
            ELECTRIC_ARGS+=(--set-env-vars "ELECTRIC_SERVICE_URL=$ELECTRIC_URL")
          fi
          # post-anki-web deploys after the API, so on a brand-new environment
          # this resolves empty and the API falls back to its env schema's
          # dev-only default — harmless, since there's no web traffic yet.
          # Every deploy after the first picks up the real web origin here.
          WEB_ORIGIN=$(gcloud run services describe post-anki-web --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)' 2>/dev/null || true)
          WEB_ORIGIN_ARGS=()
          if [ -n "$WEB_ORIGIN" ]; then
            WEB_ORIGIN_ARGS+=(--set-env-vars "WEB_ORIGIN=$WEB_ORIGIN")
          fi
          if [ -z "$INNGEST_EVENT_KEY" ] || [ -z "$INNGEST_SIGNING_KEY" ]; then
            echo "::error::PROD_INNGEST_EVENT_KEY and PROD_INNGEST_SIGNING_KEY must both be set; prod ingestion runs on Inngest."
            exit 1
          fi
          INNGEST_ARGS=(
            --set-env-vars "INNGEST_EVENT_KEY=$INNGEST_EVENT_KEY"
            --set-env-vars "INNGEST_SIGNING_KEY=$INNGEST_SIGNING_KEY"
            --set-env-vars "INNGEST_SERVE_ORIGIN=${{ vars.PROD_API_PUBLIC_URL || 'https://post-anki-api-pl6jw2mdla-ew.a.run.app' }}"
            --set-env-vars "DURABLE_EXTRACTION=1"
          )
          gcloud run deploy post-anki-api \
            --image "$API_IMAGE" \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --region ${{ vars.PROD_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --cpu-boost \
            --timeout 300s \
            --port 8030 \
            --set-env-vars "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars "OPENROUTER_API_KEY=${{ secrets.PROD_OPENROUTER_API_KEY }}" \
            --set-env-vars "CURRICULUM_MODEL=${{ vars.PROD_OPENROUTER_MODEL || 'openrouter/google/gemini-2.5-flash' }}" \
            --set-env-vars "API_SHARED_SECRET=${{ secrets.PROD_API_SHARED_SECRET }}" \
            --set-env-vars "RESEND_API_KEY=${{ secrets.PROD_RESEND_API_KEY }}" \
            --set-env-vars "BETTER_AUTH_SECRET=${{ secrets.PROD_BETTER_AUTH_SECRET }}" \
            --set-env-vars "BETTER_AUTH_URL=${{ vars.PROD_WEB_PUBLIC_URL || 'https://postanki.ilya.online' }}" \
            --set-env-vars "WEB_ORIGINS=${{ vars.PROD_WEB_PUBLIC_URL || 'https://postanki.ilya.online' }}" \
            --set-env-vars "AUTH_EMAIL_FROM=${{ vars.PROD_AUTH_EMAIL_FROM }}" \
            --set-env-vars "OWNER_EMAIL=${{ vars.PROD_OWNER_EMAIL || 'kushliansky@gmail.com' }}" \
            --set-env-vars "LOG_LEVEL=info" \
            --set-env-vars "NODE_ENV=production" \
            --set-env-vars "LANGFUSE_PUBLIC_KEY=${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" \
            --set-env-vars "LANGFUSE_SECRET_KEY=${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" \
            --set-env-vars "LANGFUSE_HOST=${{ vars.PROD_LANGFUSE_HOST || 'https://cloud.langfuse.com' }}" \
            --set-env-vars "NOTION_TOKEN=${{ secrets.PROD_NOTION_TOKEN }}" \
            --set-env-vars "EXTENSION_ID=phmjgadfbbagfjlfgcdloehdcoapiohf" \
            "${ELECTRIC_ARGS[@]}" \
            "${WEB_ORIGIN_ARGS[@]}" \
            "${INNGEST_ARGS[@]}" \
            --quiet

      - name: Verify API health
        run: |
          URL=$(gcloud run services describe post-anki-api --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)')
          echo "Health check: $URL/_healthz"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/_healthz")
            if [ "$STATUS" = "200" ]; then
              echo "API health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s"
            sleep 5
          done
          echo "API health check failed after 60s"
          exit 1

  deploy-web:
    name: Deploy Web
    needs: [test, infra, deploy-api, review-factory-gate]
    # Dormant until the web Dockerfile exists and the var is set (see .inbox/TODOS.md).
    if: ${{ vars.PROD_WEB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_CI_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.PROD_REGION }}-docker.pkg.dev --quiet

      - name: Build and push web image
        run: |
          API_URL=$(gcloud run services describe post-anki-api --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)')
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          IMAGE=${{ vars.PROD_REGISTRY }}/web:${{ github.sha }}
          docker build -f apps/web/Dockerfile --build-arg API_BASE_URL="$API_URL" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy post-anki-web \
            --image "$WEB_IMAGE" \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --region ${{ vars.PROD_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60s \
            --port 8080 \
            --set-env-vars "API_BASE_URL=$API_URL" \
            --set-env-vars "API_SHARED_SECRET=${{ secrets.PROD_API_SHARED_SECRET }}" \
            --set-env-vars "LOG_LEVEL=info" \
            --quiet

      - name: Verify web health
        run: |
          URL=$(gcloud run services describe post-anki-web --region ${{ vars.PROD_REGION }} --project ${{ vars.PROD_PROJECT_ID }} --format='value(status.url)')
          echo "Health check: $URL/login"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/login")
            if [ "$STATUS" = "200" ]; then
              echo "Web health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s"
            sleep 5
          done
          echo "Web health check failed after 60s"
          exit 1
