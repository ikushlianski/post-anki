<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Post Anki</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0d10;
        color: #e8e8e8;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: #f5f5f5;
          color: #1a1a1a;
        }
      }

      #shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        padding: 24px;
      }

      #retry-state {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      #retry-detail {
        font-size: 13px;
        opacity: 0.65;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="loading-state">Loading Post Anki&hellip;</div>
      <div id="retry-state">
        <div>Can&rsquo;t reach Post Anki right now.</div>
        <div id="retry-detail"></div>
        <button id="retry-button" type="button">Retry</button>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
