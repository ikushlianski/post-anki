name: PostAnkiIOS
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PostAnkiAPI:
    path: Packages/PostAnkiAPI
  PowerSync:
    url: https://github.com/powersync-ja/powersync-swift
    exactVersion: 1.16.4

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES

targets:
  PostAnkiIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PostAnkiIOS
      - path: Sources/Shared
      - path: Sources/PowerSyncSpike
    dependencies:
      - package: PostAnkiAPI
      - package: PowerSync
    info:
      path: Config/PostAnkiIOS-Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        PostAnkiDevAPIURL: $(POSTANKI_DEV_API_URL)
        PostAnkiProduction: $(POSTANKI_PRODUCTION)
        PostAnkiPowerSyncURL: $(POSTANKI_POWERSYNC_URL)
        PostAnkiPowerSyncToken: $(POSTANKI_POWERSYNC_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).review-pack-refresh
    settings:
      base:
        POSTANKI_PRODUCTION: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.ikushlianski.postankiios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Post Anki
      configs:
        Debug:
          OTHER_LDFLAGS: "$(inherited) -Xlinker -interposable"
    scheme: {}

  PostAnkiIOSDev:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PostAnkiIOS
      - path: Sources/Shared
      - path: Sources/PowerSyncSpike
    dependencies:
      - package: PostAnkiAPI
      - package: PowerSync
    info:
      path: Config/PostAnkiIOSDev-Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        PostAnkiDevAPIURL: $(POSTANKI_DEV_API_URL)
        PostAnkiLocalDevAPIToken: $(POSTANKI_LOCAL_DEV_API_TOKEN)
        PostAnkiPowerSyncURL: $(POSTANKI_POWERSYNC_URL)
        PostAnkiPowerSyncToken: $(POSTANKI_POWERSYNC_TOKEN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).review-pack-refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikushlianski.postankiios.dev
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        INFOPLIST_KEY_CFBundleDisplayName: Post Anki Dev
      configs:
        Debug:
          OTHER_LDFLAGS: "$(inherited) -Xlinker -interposable"
        Release:
          POSTANKI_LOCAL_DEV_API_TOKEN: ""
    scheme: {}

  PostAnkiMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/PostAnkiMac
      - path: Sources/Shared
      - path: Sources/PowerSyncSpike
    dependencies:
      - package: PostAnkiAPI
      - package: PowerSync
      - target: PostAnkiMacShare
        embed: true
    info:
      path: Config/PostAnkiMac-Info.plist
      properties:
        PostAnkiKeychainGroup: $(POSTANKI_KEYCHAIN_GROUP)
        PostAnkiAppGroup: $(POSTANKI_APP_GROUP)
        CFBundleDisplayName: $(INFOPLIST_KEY_CFBundleDisplayName)
        CFBundleName: Post Anki
        PostAnkiBandLabel: $(POSTANKI_BAND_LABEL)
        PostAnkiDevAPIURL: $(POSTANKI_DEV_API_URL)
        PostAnkiProduction: $(POSTANKI_PRODUCTION)
        PostAnkiDevAPIToken: $(POSTANKI_DEV_API_TOKEN)
        PostAnkiPowerSyncURL: $(POSTANKI_POWERSYNC_URL)
        PostAnkiPowerSyncToken: $(POSTANKI_POWERSYNC_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikushlianski.postankimac
        POSTANKI_PRODUCTION: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: Post Anki
        POSTANKI_BAND_LABEL: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          POSTANKI_PRODUCTION: "YES"
          CODE_SIGN_ENTITLEMENTS: Config/PostAnkiMac$(POSTANKI_SHARING_SUFFIX).entitlements
        Debug:
          OTHER_LDFLAGS: "$(inherited) -Xlinker -interposable"
          CODE_SIGN_ENTITLEMENTS: Config/PostAnkiMac.debug$(POSTANKI_SHARING_SUFFIX).entitlements
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          INFOPLIST_KEY_CFBundleDisplayName: Post Anki Dev
          POSTANKI_BAND_LABEL: DEV
    scheme:
      testTargets:
        - PostAnkiMacSmokeTests
        - PostAnkiMacRegistryTests

  PostAnkiMacShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/PostAnkiMacShare
    dependencies:
      - package: PostAnkiAPI
    info:
      path: Config/PostAnkiMacShare-Info.plist
      properties:
        CFBundleDisplayName: Post Anki
        CFBundleName: Post Anki
        PostAnkiKeychainGroup: $(POSTANKI_KEYCHAIN_GROUP)
        PostAnkiAppGroup: $(POSTANKI_APP_GROUP)
        PostAnkiProduction: $(POSTANKI_PRODUCTION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikushlianski.postankimac.share
        PRODUCT_NAME: PostAnkiShare
        POSTANKI_PRODUCTION: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Config/PostAnkiMacShare$(POSTANKI_SHARING_SUFFIX).entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          POSTANKI_PRODUCTION: "YES"

  PostAnkiMacSmokeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/PostAnkiMacSmokeTests
      - path: Sources/Shared
      - path: Packages/PostAnkiAPI/Tests/PostAnkiAPITests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: PostAnkiAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikushlianski.postankimacsmoketests
        GENERATE_INFOPLIST_FILE: YES

  PostAnkiMacRegistryTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/PostAnkiMacRegistryTests
    dependencies:
      - target: PostAnkiMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikushlianski.postankimacregistrytests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PostAnkiMac.app/Contents/MacOS/PostAnkiMac
        BUNDLE_LOADER: $(TEST_HOST)
